name: GPU regression request

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Select Workstation checks
    if: github.repository == 'JMartinon/sl2cfoamxx' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gpu: ${{ steps.scope.outputs.gpu }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine affected backends
        id: scope
        run: python3 .github/ci_scope.py

  workstation:
    name: GPU / Workstation request
    needs: scope
    if: needs.scope.outputs.gpu == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      # This successful job means only that a request was submitted. The
      # separate commit status remains pending until a real test result arrives.
      # The relay validates this exact successful job before dispatching.
      - name: Request Workstation regression
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --raw-field state=pending --raw-field 'context=GPU / Workstation' \
            --raw-field "description=GPU $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT: Waiting for Workstation" \
            --raw-field "target_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF_SUMMARY
          ## GPU regression pending

          Requested the exact revision \`$GITHUB_SHA\` on the Workstation.
          This job submits a request; it does not report a test pass.
          The commit's **GPU / Workstation** status reports the actual result.

          Offline or queued work remains **pending**, with no waiting timeout
          converted into a test failure. The Workstation discovers this request
          after the request job succeeds. Rerun this workflow to retry an
          interrupted execution; each attempt has its own request identifier.
          EOF_SUMMARY

  unaffected:
    name: GPU not required
    needs: scope
    if: needs.scope.outputs.gpu == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Report that this change needs no Workstation execution
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --raw-field state=success --raw-field 'context=GPU / Workstation' \
            --raw-field "description=GPU $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT: Not required for these changes" \
            --raw-field "target_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
          echo 'GPU/Mathematica tests are not required for these changes. No Workstation request was submitted; the test job is skipped.' >> "$GITHUB_STEP_SUMMARY"
